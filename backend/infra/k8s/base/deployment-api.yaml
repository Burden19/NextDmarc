apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextdmarc-api
  namespace: nextdmarc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nextdmarc-api
  template:
    metadata:
      labels:
        app: nextdmarc-api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/nextdmarc-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: nextdmarc-backend-config
            - secretRef:
                name: nextdmarc-backend-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
