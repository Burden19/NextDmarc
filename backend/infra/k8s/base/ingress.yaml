apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextdmarc-api
  namespace: nextdmarc
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  rules:
    - host: nextdmarc-staging.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nextdmarc-api
                port:
                  number: 80
