apiVersion: v1
kind: Secret
metadata:
  name: nextdmarc-backend-secrets
  namespace: nextdmarc
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://nextdmarc:nextdmarc@nextdmarc-postgres:5432/nextdmarc"
  JWT_PRIVATE_KEY: "replace-with-private-key"
  JWT_PUBLIC_KEY: "replace-with-public-key"
  ALERT_SLACK_WEBHOOK_URL: ""
  ALERT_SIEM_ENDPOINT: ""
  ALERT_SIEM_API_KEY: ""
