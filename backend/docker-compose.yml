version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nextdmarc-postgres
    environment:
      POSTGRES_DB: nextdmarc
      POSTGRES_USER: nextdmarc
      POSTGRES_PASSWORD: nextdmarc
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextdmarc -d nextdmarc"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nextdmarc-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: nextdmarc-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
    volumes:
      - es_data:/usr/share/elasticsearch/data

  minio:
    image: minio/minio:latest
    container_name: nextdmarc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextdmarc-api
    environment:
      APP_NAME: NextDmarc API
      ENVIRONMENT: development
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql+asyncpg://nextdmarc:nextdmarc@postgres:5432/nextdmarc
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      TRUSTED_HOSTS: localhost,127.0.0.1
      CORS_ALLOW_CREDENTIALS: "true"
      CORS_ALLOWED_METHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      CORS_ALLOWED_HEADERS: Authorization,Content-Type,X-Tenant-ID,X-Role,X-Request-ID,X-CSRF-Token
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      COOKIE_DOMAIN: ""
      AUTH_COOKIE_ENABLED: "true"
      AUTH_REFRESH_COOKIE_NAME: nextdmarc_refresh_token
      AUTH_CSRF_COOKIE_NAME: nextdmarc_csrf_token
      AUTH_CSRF_HEADER_NAME: X-CSRF-Token
      AUTH_REFRESH_COOKIE_PATH: /
      AUTH_CSRF_COOKIE_PATH: /
      AUTH_ALLOW_REFRESH_TOKEN_BODY_FALLBACK: "true"
      LOGIN_MAX_ATTEMPTS: "5"
      LOGIN_LOCKOUT_SECONDS: "900"
      LOGIN_WINDOW_SECONDS: "60"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 10

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextdmarc-celery-beat
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=INFO
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://nextdmarc:nextdmarc@postgres:5432/nextdmarc
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextdmarc-flower
    command: celery -A app.workers.celery_app.celery_app flower --port=5555
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pg_data:
  es_data:
  minio_data:
